<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="브라우저에 저장되는 간단한 할 일 · 위시리스트 관리 앱" />
    <title>ZAM List — 할 일 & 위시리스트</title>
    <script>
      // 첫 페인트 전에 테마를 적용해 라이트 화면이 번쩍이는 것을 막는다.
      // 저장 키는 src/stores/themeStore.ts의 THEME_STORAGE_KEY와 같아야 한다.
      (function () {
        try {
          var raw = localStorage.getItem('zam-theme');
          var theme = raw ? JSON.parse(raw).state.theme : 'system';
          var isDark =
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (e) {
          /* 저장값이 없거나 깨진 경우 라이트 모드로 시작한다. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
